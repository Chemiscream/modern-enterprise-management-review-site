<title>现代企业管理 · 考试复习</title>
<script>
  /* 首屏防闪烁：在样式表与页面渲染之前就确定并应用主题。
     优先级：URL ?theme= > 本地档案 theme 字段 > 系统偏好。 */
  (function(){
    try{
      var t = null;
      var q = new URLSearchParams(location.search).get('theme');
      if(q === 'light' || q === 'dark') t = q;
      if(!t){
        var raw = localStorage.getItem('mgt_profile_v1');
        if(raw){
          var st = JSON.parse(raw);
          if(st && (st.theme === 'light' || st.theme === 'dark')) t = st.theme;
        }
      }
      if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', t === 'dark' ? '#191715' : '#faf8f4');
    }catch(e){}
  })();
</script>
